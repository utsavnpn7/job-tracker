location_filter:
  always_allow:
    - Australia
    - Sydney
  allow:
    - Remote
    - Australia
    - Sydney
    - Melbourne
    - Brisbane
    - Perth
    - Adelaide
    - Canberra
    - Hobart
    - APAC
    - AU
search_queries:
  - name: Seek — Full Stack / Software Engineer (AU)
    query: >-
      site:seek.com.au "Full Stack" OR "Software Engineer" OR "Software
      Developer" (React OR Node OR JavaScript OR TypeScript) Sydney OR Melbourne
      OR remote
    enabled: true
  - name: Seek — Junior / Graduate Developer (AU)
    query: >-
      site:seek.com.au "Junior Developer" OR "Graduate Software Engineer" OR
      "Graduate Developer" OR "Junior Software Engineer" Sydney OR Australia
    enabled: true
  - name: LinkedIn — Full Stack / Software Engineer (AU)
    query: >-
      site:linkedin.com/jobs "Full Stack" OR "Software Engineer" OR "Software
      Developer" (React OR Node.js OR TypeScript) Australia OR Sydney
    enabled: true
  - name: LinkedIn — Junior / Graduate Developer (AU)
    query: >-
      site:linkedin.com/jobs "Junior Developer" OR "Graduate Software Engineer"
      OR "Graduate Program" Australia OR Sydney
    enabled: true
  - name: LinkedIn — Azure / Cloud & MERN Engineer (Sydney / AU)
    query: >-
      site:linkedin.com/jobs ("Azure Developer" OR "Cloud Developer" OR "MERN"
      OR "React Native") Sydney OR Australia
    enabled: true
  - name: LinkedIn — Recruiter Hiring Posts (Sydney / AU)
    query: >-
      site:linkedin.com/posts "hiring" ("Junior Developer" OR "Graduate
      Engineer" OR "Software Developer") Sydney
    enabled: true
  - name: Indeed — Full Stack / Software Engineer (AU)
    query: >-
      site:au.indeed.com "Full Stack" OR "Software Engineer" OR "Software
      Developer" (React OR Node OR JavaScript OR TypeScript) Sydney OR Australia
    enabled: false
  - name: Indeed — Junior / Graduate Developer (AU)
    query: >-
      site:au.indeed.com "Junior Developer" OR "Graduate Software Engineer" OR
      "Graduate Developer" OR "Junior Software Engineer" Sydney OR Australia
    enabled: false
  - name: SmartRecruiters — Full Stack / Software Engineer (AU)
    query: >-
      site:jobs.smartrecruiters.com "Full Stack" OR "Software Engineer" OR
      "Software Developer" (React OR Node OR JavaScript OR TypeScript) Sydney OR
      Australia
    enabled: true
  - name: SmartRecruiters — Junior / Graduate Developer (AU)
    query: >-
      site:jobs.smartrecruiters.com "Junior Developer" OR "Graduate Software
      Engineer" OR "Graduate Developer" OR "Junior Software Engineer" Sydney OR
      Australia
    enabled: true
  - name: Prosple / GradAustralia — Graduate & Junior Tech (AU)
    query: >-
      site:au.prosple.com "Software Engineer" OR "Developer" OR "Graduate" OR
      "Junior" Sydney OR Australia
    enabled: true
  - name: GradConnection — Graduate & Junior Software (AU)
    query: >-
      site:au.gradconnection.com "Software" OR "Developer" OR "Engineering" OR
      "Graduate" Sydney OR Australia
    enabled: true
  - name: Jora Australia — Full Stack / Software Engineer
    query: >-
      site:au.jora.com "Full Stack" OR "Software Engineer" OR "Software
      Developer" (React OR Node OR TypeScript) Sydney OR Australia
    enabled: true
  - name: Hatch Australia — Early Career Tech Roles
    query: site:hatch.team "Software Engineer" OR "Developer" Sydney OR Australia
    enabled: true
  - name: Direct Greenhouse — Software Engineer (Sydney / AU)
    query: >-
      site:job-boards.greenhouse.io "Software Engineer" OR "Developer" (Sydney
      OR Australia)
    enabled: true
  - name: Direct Lever — Software Engineer (Sydney / AU)
    query: 'site:jobs.lever.co "Software Engineer" OR "Developer" (Sydney OR Australia)'
    enabled: true
  - name: Adzuna — Full Stack / Software Engineer (AU)
    query: 'site:adzuna.com.au "Full Stack" OR "Software Engineer" OR "Software Developer" (React OR Node OR TypeScript) Sydney OR Australia'
    enabled: true
  - name: Adzuna — Junior / Graduate Developer (AU)
    query: 'site:adzuna.com.au "Junior Developer" OR "Graduate Software Engineer" OR "Graduate Developer" Sydney OR Australia'
    enabled: true
