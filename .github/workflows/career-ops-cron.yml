name: Career-Ops Daily AI Automation

on:
  schedule:
    # Runs daily at 21:00 UTC (7:00 AM AEST / Sydney time)
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  run-ai-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm ci
          npx playwright install-deps
          npx playwright install chromium

      - name: Run Cloud AI Pipeline (Scan + Gemini AI Eval + PDF)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          chmod +x cloud-ai-runner.sh
          ./cloud-ai-runner.sh

      - name: Commit and Push Updates
        run: |
          git config user.name "career-ops-bot"
          git config user.email "bot@career-ops.local"
          git add data/ reports/ output/
          git diff-index --quiet HEAD || git commit -m "auto: run daily portal scan & AI evaluation [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
